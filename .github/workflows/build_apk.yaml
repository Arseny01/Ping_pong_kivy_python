name: Build APK

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-22.04

    steps:
    
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install pakeges and build
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

          sudo apt-get update
          sudo apt-get install build-essential
          sudo apt-get install libstdc++6
          sudo apt-get install aidl

          pip3 install --user --upgrade Cython==0.29.33 virtualenv
          pip3 install --user --upgrade buildozer

          export PATH=$HOME/.local/bin:$PATH
          buildozer android debug --accept-sdk-license

      - name: Get APK file
        uses: actions/upload-artifact@v7
        with:
          name: result
          path: bin/*.apk


