name: Build APK for android with buildozer

on:
  workflow_dispatch:

jobs:

  Build:
    runs-on: ubuntu-22.04

    steps:
      
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev install-info targetcli-fb text-utils
          pip install --upgrade pip
          pip install buildozer cython kivy

      - name: Build APK file with buildozer
        run: |
          buildozer android debug

      - name: Get APK file
        uses: actions/upload-artifact@v4
        with:
          name: get apk
          path: bin/*.apk

      


  